[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replica"
version = "1.0.0"
description = "A replication audit of breast cancer subtype systems across TCGA-BRCA and METABRIC."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "imSheheryar"}]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lifelines>=0.27",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "plotly>=5.18",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
replica-build = "replica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests app
      - name: Test
        run: pytest -q
      - name: Validate frozen artifacts
        run: python scripts/validate_artifacts.py
      - name: Verify package import
        run: python -c "import replica; print(replica.__version__)"
